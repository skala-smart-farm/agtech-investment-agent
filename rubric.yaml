# 투자 판단 평가표 (6개 항목 × 4문항 = 24문항, 100점)
#
# 근거
# - 항목·가중치: 과제의 Scorecard 표 (창업자 30 / 시장성 25 / 제품·기술력 15 / 경쟁 우위 10 / 실적 10 / 투자조건 10)
#   원 출처인 Bill Payne Scorecard(ACA, Rev 2019)와 앞 3개 가중치가 같다. 뒤 3개는 과제 기준을 따른다.
# - 세부 질문: 과제의 Bessemer 체크리스트 10문항을 모두 배치하고(bessemer 필드),
#   AgTech 투자에서 반복되는 실패 요인(농가 ROI, 다작기 실증, 인허가, 자본집약도, 보조금 의존)을 반영했다.
#
# 판정 값
# - YES     : 질문을 직접 뒷받침하는 근거 id + 근거 원문 인용(quote). 인용이 근거 본문에 없으면 코드가 UNKNOWN 으로 강등
# - NO      : 질문과 반대되는 근거가 있음 (예: "시제품 단계" 명시)
# - UNKNOWN : 근거를 찾지 못함 → 0점. 분모를 줄이지 않는다 (정보를 감춘 회사가 유리해지지 않게)
# - N/A     : na_allowed 문항만. 사유 필수, 분모에서 제외
# third_party: 회사 자체 발표만으로는 YES 불가 (과장이 흔한 성능·경제성 수치)
# market_level: 시장 수준 문항. 그 밖의 문항은 회사 고유 사실이라 근거 본문에 회사명이 있어야 YES
# recent     : 평가일 기준 24개월 이내 근거만 인정 (기업 DB 프로필 페이지는 현재 정보로 간주)

dimensions:
  - id: founder
    name: 창업자·팀 (Owner)
    weight: 30
    questions:
      - {id: F1, bessemer: "창업자와 팀은 이 분야에서 믿을 만한가 / 창업자가 다음 10년을 이 분야에 쏟을 각오가 있는가(대리지표)", text: "창업자나 경영진이 창업 이전부터 농업 현장이나 해당 기술 분야에서 연구·실무·사업 경험을 쌓았는가? (농학·축산·수의·원예 전공, 관련 연구·실무, 이전 창업 등)", need: "이름과 경력이 함께 적힌 근거"}
      - {id: F2, bessemer: "창업자와 팀은 이 분야에서 믿을 만한가", text: "핵심 기술(AI·로봇·센서) 책임자의 기술 이력(특허 발명자, 논문, 연구소·기업 경력)이 확인되는가?", need: "기술 책임자 개인의 특허·논문·연구·경력이 적힌 근거 (회사 기술 소개나 출신 학교만으로는 부족)"}
      - {id: F3, bessemer: "(실행력)", text: "최근 24개월 안에 공개된 마일스톤(제품 출시, 현장 설치, 인증, 정부 과제·TIPS 선정, 후속 투자)이 2건 이상 있는가?", need: "날짜가 있는 마일스톤 근거 2개 이상 (투자 유치·수상·정부 선정·혁신상·우수기업 선정·출시·인증)", recent: true}
      - {id: F4, bessemer: "(커뮤니케이션·신뢰)", text: "회사가 공개한 핵심 수치(고객 수·성능·매출 등)가 제3자 근거로도 확인되는가? 서로 모순되는 근거가 있으면 NO", need: "같은 수치를 확인한 제3자 근거 (모순 근거가 있을 때만 NO)", third_party: true}
  - id: market
    name: 시장성 (Opportunity Size)
    weight: 25
    questions:
      - {id: M1, market_level: true, bessemer: "이 시장은 얼마나 큰가", text: "목표 시장(해당 세부 분야 또는 스마트농업·애그테크 시장)의 규모가 공공기관·국제기구·연구기관 문서에서 수치와 기준 연도로 확인되는가?", need: "문서 코퍼스 근거([D...]) 필수", doc_required: true}
      - {id: M2, market_level: true, bessemer: "이 스타트업이 성공한다면 정말 큰 기회가 될까", text: "해당 분야가 성장 중이라는 최근 근거(투자액·도입률·정책 예산 증가)가 있는가?", need: "발행 연도가 있는 수치"}
      - {id: M3, bessemer: "제품이 시장의 실제 문제를 해결하는가", text: "고객의 실제 문제와 제품의 경제적 효과(비용 절감, 수확량 증가, 노동 절감)가 수치로 제시되고 제3자 근거가 있는가?", need: "제3자 출처의 효과 수치", third_party: true}
      - {id: M4, bessemer: "고객이 실제로 이 제품에 비용을 지불할 이유가 있는가 / 수익 모델은 명확한가", text: "누가 돈을 내는지와 과금 방식(장비 판매, 구독, 서비스, 수수료, 공공 조달)이 확인되는가?", need: "과금 방식을 서술한 근거"}
  - id: product
    name: 제품/기술력
    weight: 15
    questions:
      - {id: P1, bessemer: "(구현 가능성)", text: "시제품 단계를 지나 실제 농장·온실·축사에서 상용으로 운영 중인가?", need: "설치 수·면적·두수·고객명 중 하나 이상"}
      - {id: P2, bessemer: "(검증)", text: "성능이 여러 작기(연도) 또는 여러 지역의 현장 실증으로 제시되는가?", need: "공공기관·대학·지자체 등 제3자 실증 근거", third_party: true}
      - {id: P3, bessemer: "경쟁사보다 뚜렷한 차별성이 있는가", text: "핵심 기술이 자체 개발임을 보여 주는 근거(자사 특허·논문, 자체 데이터셋, 자체 하드웨어)가 있는가?", need: "자체 개발 근거"}
      - {id: P4, bessemer: "기술, 운영, 법률적 리스크는 무엇인가", text: "제품 유형상 필요한 인허가·검정(농업기계 검정, 농약·비료·동물용 의약품 등록 등)을 받았거나 신청했는가? 대상이 아니면 N/A", need: "회사 제품의 검정·등록·인증 사실 (정부의 기준 마련·정책 기사는 회사 인허가 근거가 아님) 또는 N/A 사유", na_allowed: true}
  - id: competition
    name: 경쟁 우위
    weight: 10
    questions:
      - {id: C1, bessemer: "(진입장벽)", text: "핵심 기술 관련 특허(등록 또는 출원)가 1건 이상 확인되는가? (초기 기업이라 출원도 인정, 보고서에 등록·출원 구분 표기)", need: "특허 근거"}
      - {id: C2, bessemer: "경쟁사 보다 뚜렷한 차별성이 있는가", text: "국내외 경쟁사 2곳 이상과 비교했을 때 구체적인 차별점(성능·가격·적용 작목·범위)이 근거로 확인되는가?", need: "경쟁사 비교 근거"}
      - {id: C3, bessemer: "(네트워크 효과)", text: "사용이 늘수록 자체 데이터가 쌓여 성능이 좋아지거나, 설치·연동 때문에 교체 비용이 드는 구조인가?", need: "데이터 축적·연동 구조 근거"}
      - {id: C4, bessemer: "(파트너)", text: "유통·전략 파트너(농협, 농기계·농자재 기업, 지자체, 대형 유통, 해외 파트너)와 계약이나 공동사업이 있는가? (MOU 만 있으면 NO)", need: "계약 상대방이 적힌 근거"}
  - id: traction
    name: 실적
    weight: 10
    questions:
      - {id: R1, bessemer: "(매출)", text: "연도가 적힌 매출액이 기업 DB·공시·보도로 확인되는가?", need: "매출 금액과 연도 (투자 유치 금액은 매출이 아님)", recent: true}
      - {id: R2, bessemer: "초기 고객의 반응은 어떠한가", text: "유료 고객이나 설치 규모(고객 수, 농가 수, 면적, 두수, 계약 금액)가 수치로 확인되는가?", need: "수치", recent: true}
      - {id: R3, bessemer: "초기 고객의 반응은 어떠한가", text: "같은 고객의 재계약·확대 도입이나 여러 해 연속 사용 근거가 있는가?", need: "재사용 근거"}
      - {id: R4, bessemer: "(보조금 의존도)", text: "정부 보조사업이 아닌 매출(민간 판매, 수출, 기업 간 계약) 근거가 있는가?", need: "민간·수출 판매 근거"}
  - id: deal
    name: 투자조건 (Deal Terms)
    weight: 10
    questions:
      - {id: D1, bessemer: "(자금 조달)", text: "최근 24개월 안의 투자 라운드 단계·금액·시점이 공개 근거로 확인되는가?", need: "단계·금액·시점이 적힌 근거", recent: true}
      - {id: D2, bessemer: "(투자 조건의 적절성)", text: "최근 라운드에 기관투자자(VC, CVC, 정책 펀드, TIPS 운영사)가 참여했는가?", need: "투자사 이름"}
      - {id: D3, bessemer: "(Valuation·지분율)", text: "기업가치(Valuation) 또는 투자 지분율이 공개 근거로 확인되는가?", need: "수치 근거 (비공개면 UNKNOWN, 보고서에 실사 필요로 표기)"}
      - {id: D4, bessemer: "기술, 운영, 법률적 리스크는 무엇인가", text: "상업화 전에 대규모 자체 시설(대형 수직농장 등)이 필요 없는 모델이거나, 필요하다면 전략적 투자자·비희석 자금을 확보했는가?", need: "사업 모델·자금 구조 근거"}

# 관문(Gate): 적격성 검증 에이전트가 평가 전에 차단 (통과 못 하면 평가하지 않음)
gates:
  - {id: G1, text: "비상장 — 한국거래소 상장 목록과 코드로 대조, 해외는 뉴스 근거"}
  - {id: G2, text: "최근 투자 단계 Seed~Series C (근거 id 필수, 확인 불가면 탈락)"}
  - {id: G3, text: "Exit(M&A·IPO) 완료 없음 — '추진'은 통과"}
  - {id: G4, text: "최근 24개월 중대한 부정 신호 없음 (회생·파산·폐업·사업 중단·창업자 이탈·분쟁·제재) — 반증 검색 1회"}
  - {id: G5, text: "AI·센서·로봇이 농업 생산성 향상의 핵심 (배달·유통만 하는 기업, 상장사·대기업 계열 제외)"}
  - {id: G6, text: "최소 근거량 — 서로 다른 출처 3곳 이상, 그중 1곳 이상은 회사 자체 발표가 아닌 제3자 출처"}

# 거래 중단 사유(Deal-killer): 점수와 관계없이 "보류" (Payne 워크시트의 deal killer 를 공개 정보 기준으로 옮김)
deal_killers:
  - {id: K1, when: {P4: "NO"}, text: "판매 중인데 필수 인허가·검정 미취득"}
  - {id: K2, when: {C1: "NO", C2: "NO"}, text: "특허도 없고 경쟁사 대비 차별점도 없음 (쉽게 복제 가능)"}
  - {id: K3, when: {F4: "NO"}, text: "회사 공개 수치가 제3자 근거와 모순 (신뢰 문제) — 모순 근거가 있을 때만 NO"}

decision_rule: >
  투자 ⇔ 총점 ≥ 70 AND 창업자 통과율 ≥ 50% AND 시장성 통과율 ≥ 50% AND Deal-killer 없음 AND UNKNOWN 비율 ≤ 40%.
  그 외는 보류(사유: 점수 미달 / 핵심 항목 미달 / Deal-killer / 정보 부족).
  70점은 원 방법론에서 나온 값이 아닌 설계 가정이므로 60·70·80점 민감도를 함께 기록한다.
